version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetic-pipeline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cosmetic_pipeline
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: cosmetic-pipeline-mail
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
